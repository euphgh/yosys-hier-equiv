[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yosys-hier-equiv"
version = "0.1.0"
description = "Hierarchical equivalence checking experiments built on Yosys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
yosys-hier-equiv = "yosys_hier_equiv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

